[pytest]
pythonpath = .
testpaths = backend model autonomy
python_files = test_*.py *_test.py
python_functions = test_*
markers =
    real_data: requires physically real insolacao/temperatura data (DATA_MODE=real) —
        skip/exclude when running against DATA_MODE=mock, which falls back to random
        noise and gives these tests no valid signal (see backend/test_api.py)

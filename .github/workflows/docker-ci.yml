name: Docker CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python for dependency audit
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Backend dependency audit (pip-audit)
        run: |
          pip install -q -r requirements.txt
          pip install -q pip-audit
          pip-audit --local

      - name: Set up Node for dependency audit
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend dependency audit (npm audit)
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image
        run: docker build -t lunar-backend .

      - name: Test Python version
        run: docker run --rm lunar-backend python --version

      - name: Run unit tests (mock data)
        run: |
          docker run --rm \
            -e DATA_MODE=mock \
            -e PYTHONPATH=/app \
            lunar-backend \
            python -m pytest -v --tb=short -m "not real_data"

      # Testes marcados `real_data` (backend/test_api.py) fazem asserção
      # científica sobre coordenadas reais de PSR (Shackleton/equador) — não
      # têm sinal válido contra DATA_MODE=mock, que cai em fallback de ruído
      # aleatório quando data/processed/lro/mock/ não existe (não é tracked em
      # git). Rodam aqui, contra dado real recém-gerado + o model/pesos.pth já
      # commitado (produção), ANTES do retreino de 5 épocas abaixo sobrescrever
      # os pesos com um modelo mais fraco só para regressão rápida do pipeline.
      - name: Scientific validation benchmark (real data)
        run: |
          docker run --rm \
            -e DATA_MODE=real \
            -e TRAIN_EPOCHS=5 \
            -e PYTHONPATH=/app \
            lunar-backend \
            sh -c "python -m data.data_pipeline.generate_scientific_data --modo real && \
                   python -m pytest backend/test_api.py -v --tb=short -m real_data && \
                   python -m model.train && \
                   python -m model.validate"

      - name: Smoke test API
        run: |
          docker run -d -p 8000:8000 \
            -e DATA_MODE=mock \
            --name test \
            lunar-backend
          sleep 10
          curl -f http://localhost:8000/health || (docker logs test && exit 1)
          docker stop test
          docker rm test

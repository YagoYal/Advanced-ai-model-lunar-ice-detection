version: 2
# Minor/patch agrupados em 1 PR por ecossistema por semana; majors
# continuam em PRs separados para revisão individual.
updates:
  # Backend — requirements.txt na raiz
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    groups:
      backend-minor-patch:
        update-types: ["minor", "patch"]

  # Frontend — package.json em frontend/
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    groups:
      frontend-minor-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions — workflows em .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions:
        patterns: ["*"]
